<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>XR Teleop · Sabana Hack</title>
<style>
  :root{ --bg:#0b1020; --panel:#141b33; --line:#27304f; --ink:#e8ecfb; --dim:#97a2c8; --acc:#4fd1c5; --warn:#f6ad55; --bad:#fc8181; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  canvas{display:block}
  #ui{position:fixed;left:12px;top:12px;z-index:10;background:rgba(20,27,51,.92);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:270px;backdrop-filter:blur(6px)}
  #ui h1{margin:0 0 2px;font-size:15px;letter-spacing:.3px}
  #ui .sub{color:var(--dim);font-size:12px;margin-bottom:10px}
  .fila{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  button{font:inherit;font-size:13px;padding:7px 11px;border-radius:8px;border:1px solid var(--line);background:#1b2340;color:var(--ink);cursor:pointer}
  button:hover{border-color:var(--acc)}
  button.pri{background:var(--acc);color:#06281f;border-color:var(--acc);font-weight:600}
  button.rec{background:var(--bad);color:#2b0a0a;border-color:var(--bad);font-weight:600}
  label{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px;margin-bottom:6px}
  input[type=text]{flex:1;min-width:0;font:inherit;font-size:12px;padding:5px 7px;border-radius:6px;border:1px solid var(--line);background:#0f1530;color:var(--ink)}
  #estado{font-size:12px;color:var(--dim);border-top:1px solid var(--line);padding-top:8px;margin-top:4px;white-space:pre-line}
  .punto{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-right:6px;vertical-align:1px}
  .punto.on{background:var(--acc)}
  #xr{position:fixed;right:12px;bottom:12px;z-index:10;display:flex;gap:8px}
  #ayuda{position:fixed;left:12px;bottom:12px;z-index:10;color:var(--dim);font-size:12px;max-width:420px}
</style>
</head>
<body>
<div id="ui">
  <h1>XR Teleop</h1>
  <div class="sub">Sabana Hack 2026 · puente visor ↔ robot</div>
  <label>servidor <input id="url" type="text" value=""></label>
  <div class="fila">
    <button id="conectar" class="pri">Conectar</button>
    <button id="calibrar">Calibrar</button>
    <button id="reset">Reposo</button>
  </div>
  <label>tarea <input id="tarea" type="text" value="demo"></label>
  <div class="fila"><button id="grabar" class="rec">● Grabar</button></div>
  <div id="estado"><span class="punto" id="luz"></span>sin conectar</div>
</div>
<div id="xr"></div>
<div id="ayuda">Escritorio: arrastra con el ratón para orbitar, rueda para acercar, y arrastra las esferas de colores para mover las manos del robot. Visor: entra en VR o AR y mueve tus manos.</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
